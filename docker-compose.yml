services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: condoflow
      POSTGRES_PASSWORD: condoflow
      POSTGRES_DB: condoflow_app_production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U condoflow -d condoflow_app_production"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
   
    environment:
      DB_USERNAME: condoflow
      DB_PASSWORD: condoflow
      DB_HOST: db
      DB_PORT: 5432
      RAILS_ENV: ${RAILS_ENV:-development}
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      RAILS_LOG_TO_STDOUT: "true"
    ports:
      - "3000:80"

volumes:
  postgres_data: